[workspace]
authors = ["Martin Inauen <inauen@mesh.ch>"]
channels = ["https://prefix.dev/conda-forge", "https://prefix.dev/robostack-jazzy"]
name = "abb_ros2"
platforms = ["linux-64"]
version = "0.1.0"

[environments]
default = ["full"]
rws-client = ["rws-client"]

[tasks.setup]
cmd = """bash -lc '
set -euo pipefail
mkdir -p src
vcs import src < abb.repos
'"""
description = "Import external ABB repositories into src/."

[tasks.build]
cmd = """colcon build --symlink-install{% if pixi.environment.name == "rws-client" %} --packages-up-to abb_rws_client{% endif %}"""
description = "Build the full workspace by default, or only the RWS client stack in the rws-client environment."

[tasks.build-rws]
cmd = "colcon build --symlink-install --packages-up-to abb_rws_client"
description = "Build the shared ABB packages needed for abb_rws_client."

[dependencies]
python = "3.12.*"
compilers = "*"
cmake = ">=3.8,<4"
pkg-config = "*"
make = "*"
ninja = "*"
poco = "*"
colcon-common-extensions = "*"
vcstool = "*"
ros-jazzy-desktop = "*"

[target.linux-64.dependencies]
libgl-devel = "*"

[feature.full.dependencies]
ros-jazzy-moveit = "*"
ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"
ros-jazzy-ros-testing = "*"

[feature.rws-client.dependencies]

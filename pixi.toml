[workspace]
authors = ["Martin Inauen <inauen@mesh.ch>"]
channels = ["https://prefix.dev/conda-forge", "https://prefix.dev/robostack-jazzy"]
name = "abb_ros2"
platforms = ["linux-64"]
version = "0.1.0"
preview = ["pixi-build"]

[tasks.setup]
cmd = """bash -lc '
set -euo pipefail
mkdir -p src
vcs import src < abb.repos
'"""
description = "Import external ABB repositories into src/."

[tasks.build]
cmd = "colcon build --symlink-install"
description = "Build the ros2 workspace."

[dependencies]
python = "3.12.*"
compilers = "*"
cmake = ">=3.8,<4"
pkg-config = "*"
make = "*"
ninja = "*"
poco = "*"
colcon-common-extensions = "*"
vcstool = "*"
ros-jazzy-moveit = "*"
ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"
ros-jazzy-ros-testing = "*"
ros-jazzy-desktop = "*"

[target.linux-64.dependencies]
libgl-devel = "*"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*", channels = ["https://prefix.dev/conda-forge"] }

[activation]
scripts = ["install/setup.sh"]